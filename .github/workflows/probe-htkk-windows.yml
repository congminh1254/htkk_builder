name: Kiểm tra điều kiện chạy HTKK Windows
# Public fixed case id only; lets the release dispatcher detect an already-created run before any retry.
run-name: HTKK native case ${{ inputs.web_case_id }} (${{ inputs.gui_automation }})${{ inputs.htkk_version == '5.8.2' && ' [HTKK 5.8.2]' || '' }}
on:
  workflow_dispatch:
    inputs:
      install_and_probe:
        description: Cài MSI đã xác minh và kiểm chứng chế độ đã chọn bằng dữ liệu hoàn toàn giả lập
        type: boolean
        required: true
        default: false
      gui_automation:
        description: 'Automation THAM CHIẾU riêng: chỉ custom CLR2/x86 + synthetic login'
        type: choice
        options: [none, inspect, profile-save, gtgt-inspect, gtgt-sheet-inspect, gtgt-amendment-inspect, gtgt-amendment-open-inspect, gtgt-amendment-khbs-inspect, gtgt-annex12-inspect, gtgt-annex12-row-inspect, gtgt-annex12-input-inspect, gtgt-annex12-numeric-inspect, gtgt-annex12-export-inspect, gtgt-annex12-export-nonzero, gtgt-export-inspect, gtgt-roundtrip-inspect, gtgt-web-import-inspect, declaration-web-import-inspect]
        default: none
        required: true
      web_case_id:
        description: Fixed synthetic declaration case (no user data)
        type: choice
        options: [01GTGT-zero-M10-2026, 01GTGT-sale10-M10-2026, 01GTGT-sale10-half-M10-2026, 01GTGT-sale10-manual-M10-2026, 01GTGT-sale5-half-M10-2026, 01GTGT-sale5-manual-M10-2026, 01GTGT-noactivity-zero-M10-2026, 01GTGT-noactivity-reset-sale10-M10-2026, 01GTGT-noactivity-cancel-sale10-M10-2026, 01GTGT-noactivity-uncheck-sale10-M10-2026, 01GTGT-noactivity-keep-credit-M10-2026, 01GTGT-zero-Q4-2026, 01GTGT-native-import-sale10-M10-2026, 01GTGT-annex12-zero-two-locations-M10-2026, 01GTGT-annex12-two-plants-nonzero-M10-2026, 03TNDN-profit20-Y2025, BCTC133-B01a-basic-Y2025, BCTC200-LT-basic-Y2025, 05KK-withheld-Q3-2026, 05KK-TT89-withheld-Q4-2026, 05QTT-two-employees-Y2025, 01CNKD-TT50-revenue-two-groups-Q3-2026, 02QTT-dependants-Y2025, 01NTNN-two-contractors-M09-2026, 03NTNN-no-rate-M10-2026, 01NTNN-NCCNN-entry-M10-2026, 04NTNN-TT80-one-subcontractor-2026, 04NTNN-TT89-one-subcontractor-2026, 02NTNN-TT89-two-annexes-2026, 02NTNN-TT80-two-annexes-2026, 01NTNN-occurrence-D20-09-2026, 01NTNN-NCCNN-occurrence-D20-10-2026, 03NTNN-occurrence-D20-10-2026, 01CNKD-TT50-310-pl01-three-groups-Q3-2026, 01CNKD-TT50-310-pl03-two-groups-Q3-2026, 01GTGT-annex10-nq204-M10-2026, 03TNDN-rate15-Y2025, 03TNDN-rate17-Y2025, 01GTGT-khbs-zero-to-sale10-M10-2026]
        default: 01GTGT-zero-M10-2026
        required: true
      web_artifact_commit:
        description: Immutable private synthetic artifact commit (optional for manual legacy input)
        type: string
        required: false
      web_source_sha:
        description: Private source commit required for the synthetic web XML import case
        type: string
        required: false
      synthetic_login:
        description: 'Đăng nhập bằng MST giả lập; xuất/nhập chỉ theo chế độ tham chiếu đã chọn'
        type: boolean
        required: false
        default: false
      acknowledge_registration:
        description: 'Chỉ xác nhận nút OK của hộp RegSvr32 Microsoft thuộc tiến trình kiểm thử; lỗi đăng ký vẫn chặn'
        type: boolean
        required: false
        default: false
      runtime_host:
        description: 'Kiểu chạy: original hoặc host CLR2/x86 tham chiếu riêng; không sửa binary gốc'
        type: choice
        options: [original, clr2-x86-reference]
        default: original
        required: true
      htkk_version:
        description: 'Phiên bản HTKK làm oracle (5.8.1 mặc định; 5.8.2 chỉ cho cohort native riêng, không gate release)'
        type: choice
        options: ['5.8.1', '5.8.2']
        default: '5.8.1'
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: native-${{ inputs.web_source_sha || github.run_id }}-${{ inputs.web_case_id }}-${{ inputs.gui_automation }}${{ inputs.htkk_version == '5.8.2' && '-htkk582' || '' }}
  cancel-in-progress: false
jobs:
  readiness:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      # Source contracts contain official Vietnamese labels; never use Windows ACP.
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check generated native automation contract is synchronized
        shell: pwsh
        run: python ./scripts/generate-native-automation-registry.py --check
      - name: Check trusted case registry is synchronized
        shell: pwsh
        run: python ./scripts/generate-native-cases.py --check
      - name: Test complete builder contracts without network
        shell: pwsh
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Check generated typed flags counters defaults and mode ranges
        shell: pwsh
        run: ./scripts/Test-HtkkNativeResultContract.ps1
      - name: Check safe reference-result boundary
        shell: pwsh
        run: ./scripts/Test-HtkkSafeGuiReferenceResult.ps1
      - name: Check classified pinned download and attempt limits
        shell: pwsh
        run: ./scripts/Test-HtkkPinnedDownload.ps1
      - name: Check bounded native process and clean environment
        shell: pwsh
        run: ./scripts/Test-HtkkBoundedNativeProcess.ps1
      - name: Check bounded compiler diagnostics and complete cleanup
        shell: pwsh
        run: ./scripts/Test-HtkkBoundedCompiler.ps1
      - name: Check bounded oracle Job cleanup and environment
        shell: pwsh
        run: ./scripts/Test-HtkkBoundedJobProcess.ps1
      - name: Check supplier Job cleanup and retained identity boundary
        shell: pwsh
        run: ./scripts/Test-HtkkSupplierJobBoundary.ps1
      - name: Check UIA cleanup and bounded result boundary
        shell: pwsh
        run: ./scripts/Test-HtkkUiaProcessBoundary.ps1
      - name: Check clean Framework UIA assembly readiness
        shell: pwsh
        run: ./scripts/Test-HtkkFrameworkUiaAssemblyLoad.ps1
      - name: Check actual C# web-tax comparison boundaries
        shell: pwsh
        run: ./scripts/Test-HtkkWebTaxComparison.ps1
      - name: Test private GUI XML evidence boundaries without network
        shell: pwsh
        run: python -m unittest discover -s scripts -p test_gtgt_export_evidence.py
      - name: Test private synthetic web input boundaries without network
        shell: pwsh
        run: python -m unittest discover -s scripts -p test_htkk_web_input.py
      - name: Test fixed original annex export boundaries without network
        shell: pwsh
        run: python -m unittest discover -s scripts -p test_annex12_export_publication.py
      - name: Test fixed annex web cases and nonzero export boundaries without network
        shell: pwsh
        run: python -m unittest discover -s scripts -p test_annex12_native_cases.py
      - name: Test declaration-family native cases and boundaries without network
        shell: pwsh
        run: python -m unittest discover -s scripts -p test_declaration_native_cases.py
      - name: Fetch fixed synthetic web XML privately
        if: inputs.install_and_probe && (inputs.gui_automation == 'gtgt-web-import-inspect' || inputs.gui_automation == 'gtgt-amendment-khbs-inspect' || inputs.gui_automation == 'declaration-web-import-inspect')
        shell: pwsh
        env:
          WEB_ARTIFACT_COMMIT: ${{ inputs.web_artifact_commit }}
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
          EXPECTED_WEB_CASE_ID: ${{ inputs.web_case_id }}
          EXPECTED_WEB_SOURCE_SHA: ${{ inputs.web_source_sha }}
        run: python ./scripts/fetch-htkk-web-input.py
      - name: Queue separate native harness sample status before supplier launch
        if: inputs.install_and_probe && inputs.gui_automation == 'gtgt-roundtrip-inspect'
        shell: pwsh
        env:
          EXPECTED_WEB_SOURCE_SHA: ${{ inputs.web_source_sha }}
          SAMPLE_STATE: pending
          SOURCE_STATUS_TOKEN: ${{ secrets.SOURCE_STATUS_TOKEN || secrets.SOURCE_READ_TOKEN }}
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python ./scripts/report-native-sample.py
      - name: Kiểm tra nguồn và điều kiện Windows
        id: native_probe
        shell: pwsh
        env:
          EXPECTED_WEB_CASE_ID: ${{ inputs.web_case_id }}
          EXPECTED_WEB_SOURCE_SHA: ${{ inputs.web_source_sha }}
          WEB_ARTIFACT_COMMIT: ${{ inputs.web_artifact_commit }}
          PROBE_INSTALL: ${{ inputs.install_and_probe }}
          PROBE_RUNTIME_HOST: ${{ inputs.runtime_host }}
          PROBE_GUI_AUTOMATION: ${{ inputs.gui_automation }}
          PROBE_SYNTHETIC_LOGIN: ${{ inputs.synthetic_login }}
          PROBE_ACK_REGISTRATION: ${{ inputs.acknowledge_registration }}
          PROBE_HTKK_VERSION: ${{ inputs.htkk_version }}
        run: |
          $probe = $env:PROBE_INSTALL -eq 'true'
          $syntheticLogin = $env:PROBE_SYNTHETIC_LOGIN -eq 'true'
          $ackRegistration = $env:PROBE_ACK_REGISTRATION -eq 'true'
          $guiAutomation = if ([string]::IsNullOrEmpty($env:PROBE_GUI_AUTOMATION)) { 'none' } else { $env:PROBE_GUI_AUTOMATION }
          if ($guiAutomation -notin @('none','inspect','profile-save','gtgt-inspect','gtgt-sheet-inspect','gtgt-amendment-inspect','gtgt-amendment-open-inspect','gtgt-amendment-khbs-inspect','gtgt-annex12-inspect','gtgt-annex12-row-inspect','gtgt-annex12-input-inspect','gtgt-annex12-numeric-inspect','gtgt-annex12-export-inspect','gtgt-annex12-export-nonzero','gtgt-export-inspect','gtgt-roundtrip-inspect','gtgt-web-import-inspect','declaration-web-import-inspect')) { throw 'Invalid reference GUI automation mode.' }
          $runtimeHost = if ([string]::IsNullOrEmpty($env:PROBE_RUNTIME_HOST)) { 'original' } else { $env:PROBE_RUNTIME_HOST }
          if ($runtimeHost -notin @('original','clr2-x86-reference')) { throw 'Invalid runtime host mode.' }
          $oracleVersion = if ([string]::IsNullOrEmpty($env:PROBE_HTKK_VERSION)) { '5.8.1' } else { $env:PROBE_HTKK_VERSION }
          if ($oracleVersion -cnotin @('5.8.1','5.8.2')) { throw 'Invalid HTKK oracle version.' }
          & ./scripts/probe-htkk-windows.ps1 -InstallAndProbe:$probe -RuntimeHost $runtimeHost -AcknowledgeRegistration:$ackRegistration -SyntheticLogin:$syntheticLogin -GuiAutomation $guiAutomation -OracleVersion $oracleVersion
      # Native web regressions retain only their dedicated per-case output; shared
      # startup/common-header references remain available in manual reference modes.
      - name: Publish supplier startup window privately
        if: always() && inputs.install_and_probe && steps.native_probe.outputs.credentials_safe == 'true' && inputs.gui_automation != 'gtgt-web-import-inspect' && inputs.gui_automation != 'gtgt-amendment-khbs-inspect' && inputs.gui_automation != 'declaration-web-import-inspect'
        shell: pwsh
        env:
          SOURCE_PUBLISH_TOKEN: ${{ secrets.SOURCE_PUBLISH_TOKEN || secrets.SOURCE_READ_TOKEN }}
        run: python ./scripts/publish-windows-diagnostic.py
      - name: Retain synthetic common-header reference privately
        if: always() && inputs.install_and_probe && steps.native_probe.outputs.credentials_safe == 'true' && inputs.gui_automation != 'gtgt-web-import-inspect' && inputs.gui_automation != 'gtgt-amendment-khbs-inspect' && inputs.gui_automation != 'declaration-web-import-inspect'
        shell: pwsh
        env:
          SOURCE_PUBLISH_TOKEN: ${{ secrets.SOURCE_PUBLISH_TOKEN || secrets.SOURCE_READ_TOKEN }}
        run: python ./scripts/publish-common-header-evidence.py
      - name: Retain verified synthetic GTGT export privately
        if: always() && inputs.install_and_probe && steps.native_probe.outputs.credentials_safe == 'true' && inputs.gui_automation == 'gtgt-export-inspect'
        shell: pwsh
        env:
          SOURCE_PUBLISH_TOKEN: ${{ secrets.SOURCE_PUBLISH_TOKEN || secrets.SOURCE_READ_TOKEN }}
        run: python ./scripts/publish-gtgt-export-evidence.py
      - name: Retain fixed original 01-2 GTGT export privately
        if: always() && inputs.install_and_probe && steps.native_probe.outcome == 'success' && steps.native_probe.outputs.credentials_safe == 'true' && steps.native_probe.outputs.supplier_stopped == 'true' && inputs.gui_automation == 'gtgt-annex12-export-inspect'
        shell: pwsh
        env:
          SOURCE_PUBLISH_TOKEN: ${{ secrets.SOURCE_PUBLISH_TOKEN || secrets.SOURCE_READ_TOKEN }}
        run: python ./scripts/publish-htkk-annex12-export.py
      - name: Retain fixed original nonzero 01-2 GTGT exports privately
        if: always() && inputs.install_and_probe && steps.native_probe.outcome == 'success' && steps.native_probe.outputs.credentials_safe == 'true' && steps.native_probe.outputs.supplier_stopped == 'true' && inputs.gui_automation == 'gtgt-annex12-export-nonzero'
        shell: pwsh
        env:
          SOURCE_PUBLISH_TOKEN: ${{ secrets.SOURCE_PUBLISH_TOKEN || secrets.SOURCE_READ_TOKEN }}
        run: python ./scripts/publish-htkk-annex12-nonzero-export.py
      - name: Retain verified raw native web reexport privately
        if: always() && inputs.install_and_probe && steps.native_probe.outputs.credentials_safe == 'true' && steps.native_probe.outputs.supplier_stopped == 'true' && inputs.gui_automation == 'gtgt-web-import-inspect' && inputs.web_artifact_commit != ''
        shell: pwsh
        env:
          EXPECTED_WEB_SOURCE_SHA: ${{ inputs.web_source_sha }}
          EXPECTED_WEB_CASE_ID: ${{ inputs.web_case_id }}
          WEB_ARTIFACT_COMMIT: ${{ inputs.web_artifact_commit }}
          SOURCE_PUBLISH_TOKEN: ${{ secrets.SOURCE_PUBLISH_TOKEN || secrets.SOURCE_READ_TOKEN }}
          HTKK_ORACLE_VERSION: ${{ inputs.htkk_version }}
        run: python ./scripts/publish-htkk-web-native-output.py
      # Declaration families: the raw original export is retained even when the harness reported
      # a whole-tree mismatch (status stays failure); the publisher re-validates privacy first.
      - name: Retain raw native declaration export privately
        if: always() && inputs.install_and_probe && steps.native_probe.outputs.credentials_safe == 'true' && steps.native_probe.outputs.supplier_stopped == 'true' && inputs.gui_automation == 'declaration-web-import-inspect' && inputs.web_artifact_commit != ''
        shell: pwsh
        env:
          EXPECTED_WEB_SOURCE_SHA: ${{ inputs.web_source_sha }}
          EXPECTED_WEB_CASE_ID: ${{ inputs.web_case_id }}
          WEB_ARTIFACT_COMMIT: ${{ inputs.web_artifact_commit }}
          SOURCE_PUBLISH_TOKEN: ${{ secrets.SOURCE_PUBLISH_TOKEN || secrets.SOURCE_READ_TOKEN }}
          HTKK_ORACLE_VERSION: ${{ inputs.htkk_version }}
        run: python ./scripts/publish-htkk-declaration-native-output.py
      - name: Retain native-first harness sample and report its separate status privately
        id: native_sample_publish
        if: always() && inputs.install_and_probe && steps.native_probe.outcome == 'success' && steps.native_probe.outputs.credentials_safe == 'true' && steps.native_probe.outputs.supplier_stopped == 'true' && inputs.gui_automation == 'gtgt-roundtrip-inspect'
        shell: pwsh
        env:
          EXPECTED_WEB_SOURCE_SHA: ${{ inputs.web_source_sha }}
          SOURCE_PUBLISH_TOKEN: ${{ secrets.SOURCE_PUBLISH_TOKEN || secrets.SOURCE_READ_TOKEN }}
        run: python ./scripts/publish-htkk-native-sample.py
      - name: Report unsuccessful native harness sample after verified cleanup
        if: always() && inputs.install_and_probe && inputs.gui_automation == 'gtgt-roundtrip-inspect' && steps.native_probe.outputs.credentials_safe == 'true' && steps.native_probe.outputs.supplier_stopped == 'true' && (steps.native_probe.outcome != 'success' || steps.native_sample_publish.outcome != 'success')
        shell: pwsh
        env:
          EXPECTED_WEB_SOURCE_SHA: ${{ inputs.web_source_sha }}
          SAMPLE_STATE: failure
          SOURCE_STATUS_TOKEN: ${{ secrets.SOURCE_STATUS_TOKEN || secrets.SOURCE_READ_TOKEN }}
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python ./scripts/report-native-sample.py
      - name: Report fixed native-case status privately
        if: always() && inputs.install_and_probe && steps.native_probe.outputs.credentials_safe == 'true' && steps.native_probe.outputs.supplier_stopped == 'true' && (inputs.gui_automation == 'gtgt-web-import-inspect' || inputs.gui_automation == 'gtgt-amendment-khbs-inspect' || inputs.gui_automation == 'declaration-web-import-inspect')
        shell: pwsh
        env:
          SOURCE_STATUS_TOKEN: ${{ secrets.SOURCE_STATUS_TOKEN || secrets.SOURCE_READ_TOKEN }}
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ inputs.web_source_sha }}
          WEB_CASE_ID: ${{ inputs.web_case_id }}
          WEB_ARTIFACT_COMMIT: ${{ inputs.web_artifact_commit }}
          PROBE_RESULT: ${{ steps.native_probe.outcome }}
          HTKK_ORACLE_VERSION: ${{ inputs.htkk_version }}
        run: python ./scripts/report-native-case.py
      # No public artifact, cache, screenshot, raw process/window title or taxpayer input.
      # Only bounded verified supplier windows may enter the fixed PRIVATE diagnostic branch.
  report_failure:
    # This fresh Linux job never runs the supplier, private source or its outputs.
    # It may only downgrade a fixed case to failure after preflight/body/post-step
    # failure; an early successful callback is not whole-workflow acceptance.
    if: always() && github.ref == 'refs/heads/main' && (inputs.gui_automation == 'gtgt-web-import-inspect' || inputs.gui_automation == 'gtgt-amendment-khbs-inspect' || inputs.gui_automation == 'declaration-web-import-inspect') && (needs.readiness.result == 'failure' || needs.readiness.result == 'cancelled')
    needs: readiness
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout trusted failure callback only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Clear pending native case after unsuccessful whole job
        env:
          SOURCE_STATUS_TOKEN: ${{ secrets.SOURCE_STATUS_TOKEN || secrets.SOURCE_READ_TOKEN }}
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ inputs.web_source_sha }}
          WEB_CASE_ID: ${{ inputs.web_case_id }}
          WEB_ARTIFACT_COMMIT: ${{ inputs.web_artifact_commit }}
          GUI_AUTOMATION: ${{ inputs.gui_automation }}
          READINESS_RESULT: ${{ needs.readiness.result }}
          HTKK_ORACLE_VERSION: ${{ inputs.htkk_version }}
        run: python3 scripts/report-native-failure.py
