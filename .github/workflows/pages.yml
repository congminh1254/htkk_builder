name: Deploy verified HTKK website
on:
  workflow_run:
    workflows: [HTKK trusted builder]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pages_commit:
        description: Full immutable private pages-output commit for retry
        required: true
permissions:
  contents: read
concurrency:
  group: htkk-production-pages
  cancel-in-progress: false
# actions/deploy-pages@v4 uses the builder SHA as pages_build_version, so a release on an
# unchanged builder reuses the previous deployment ID and is silently dropped (Pages 109), and a
# version that is not a repository commit is rejected (HTTP 404, Pages 111). Every deployment
# therefore gets its own marker commit on the orphan branch pages-deploy-log (never merged).
jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.display_title == 'HTKK release' && github.event.workflow_run.repository.full_name == 'congminh1254/htkk_builder'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      pages_commit: ${{ steps.artifact_commit.outputs.pages_commit }}
      source_sha: ${{ steps.expect.outputs.source_sha }}
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - name: Checkout trusted builder only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: builder
          persist-credentials: false
      - name: Resolve immutable private artifact
        id: artifact_commit
        env:
          GH_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
          REQUESTED_COMMIT: ${{ inputs.pages_commit }}
        run: |
          PAGES_COMMIT=$(gh api repos/htkk-net/htkk_web/commits/pages-output --jq .sha)
          [[ "$PAGES_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ -z "$REQUESTED_COMMIT" || "$REQUESTED_COMMIT" == "$PAGES_COMMIT" ]] || exit 1
          echo "PAGES_COMMIT=$PAGES_COMMIT" >> "$GITHUB_ENV"
          echo "pages_commit=$PAGES_COMMIT" >> "$GITHUB_OUTPUT"
      - name: Checkout generated static output only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: htkk-net/htkk_web
          ref: ${{ env.PAGES_COMMIT }}
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: output
          persist-credentials: false
      - name: Validate artifact, source main and all native workflows
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BUILD_RUN: ${{ github.event.workflow_run.id }}
        run: python3 builder/scripts/validate-pages.py
      - name: Record artifact source SHA for public verification
        id: expect
        run: python3 builder/scripts/pages-deploy.py expect
      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/site
      - name: Remove local private artifact
        if: always()
        run: rm -rf output
  marker:
    # The only job that can write: it pushes one provenance commit to refs/heads/pages-deploy-log.
    # No artifact checkout and no source token; it runs only the trusted builder script.
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      marker_sha: ${{ steps.marker.outputs.marker_sha }}
    steps:
      - name: Checkout trusted builder only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: builder
          persist-credentials: false
      - name: Push deployment marker to pages-deploy-log
        id: marker
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_COMMIT: ${{ needs.prepare.outputs.pages_commit }}
          EXPECTED_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: python3 builder/scripts/pages-deploy.py marker
  deploy:
    needs: [prepare, marker]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout trusted builder only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: builder
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Deploy artifact under its marker commit
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.prepare.outputs.artifact_id }}
          MARKER_SHA: ${{ needs.marker.outputs.marker_sha }}
          PAGES_COMMIT: ${{ needs.prepare.outputs.pages_commit }}
          EXPECTED_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: python3 builder/scripts/pages-deploy.py deploy
      - name: Verify public site serves this artifact
        env:
          MARKER_SHA: ${{ needs.marker.outputs.marker_sha }}
          EXPECTED_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: python3 builder/scripts/pages-deploy.py verify
