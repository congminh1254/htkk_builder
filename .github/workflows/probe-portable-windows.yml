name: Kiểm tra portable trên Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Kiểm tra runtime và máy chủ portable
        shell: pwsh
        run: ./scripts/probe-portable-windows.ps1
      # No source checkout, secrets, artifacts, caches, screenshots or user inputs.
